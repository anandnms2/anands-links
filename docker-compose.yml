# Anands Links — Linkwarden fork (orange / black / grey), Authentik SSO.
# Deploy:  cp .env.anands.example .env  → fill secrets → docker compose up -d --build
#          (first build is slow and needs ~4 GB RAM: Rust monolith + Next.js)
# Coolify: use this file as a Docker Compose resource, put the domain on the
#          `anands-links` service (port 3000), and paste .env values in Environment.
services:
  postgres:
    image: postgres:16-alpine
    container_name: anands-links-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - anands_links_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: anands-links-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - anands_links_meili:/meili_data

  anands-links:
    # Built from source on the server (no registry needed).
    image: anands-links:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anands-links
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "${LINKS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://links.anands.xyz/api/v1/auth}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # --- Authentik SSO (email is the matching key across Anands apps) ---
      NEXT_PUBLIC_AUTHENTIK_ENABLED: "true"
      AUTHENTIK_CUSTOM_NAME: "Anands SSO"
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-https://sso.anands.xyz/application/o/anands-links}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      # Set to "false" after your first SSO login to stop public sign-ups
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      # Hide the password form once SSO works (uncomment):
      # NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
    volumes:
      - anands_links_data:/data/data

volumes:
  anands_links_pg:
  anands_links_meili:
  anands_links_data:
